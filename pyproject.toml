[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "extract-eval"
version = "0.1.0"
description = "Open eval kit for LLM extraction from clinical-style notes (synthetic data only)"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.6",
  "litellm>=1.40",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
